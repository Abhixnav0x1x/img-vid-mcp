[project]
name = "imagemcp"
version = "1.3.0"
description = "Free self-hostable MCP: web image/video search + fast direct-file video downloads (yt-dlp) + bulk + auto lossless image optimisation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0.0",
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "pillow>=10.0.0",
  "ddgs>=9.0.0",
  "yt-dlp>=2024.8.0",
]

[project.optional-dependencies]
extras = [
  "camoufox[geoip]>=0.4.0",
  "playwright>=1.44.0"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["providers*"]
